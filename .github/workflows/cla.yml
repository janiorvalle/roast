name: CLA check

on: # zizmor: ignore[dangerous-triggers] this workflow writes signatures and never checks out PR code
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cla:
    name: CLA check
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # Required by the CLA action to manage workflow state.
      contents: write # Required to update CLA signature records.
      pull-requests: write # Required to label and comment on pull requests.
      statuses: write # Required to publish the CLA status.
    steps:
      - name: Check contributor agreement # zizmor: ignore[archived-uses] owner-approved CLA action
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/janiorvalle/roast/blob/main/CONTRIBUTING.md
          branch: signatures
          allowlist: janiorvalle,dependabot[bot],*[bot]
